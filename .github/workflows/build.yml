name: Gerar APK do Bonny

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bonny-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Compilar APK de debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Não usar android-actions/setup-android aqui: a versão anterior tentou
      # instalar o pacote obsoleto "tools" e encerrou com exit code 1.
      - name: Instalar componentes do Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          fi
          if [ -z "${SDKMANAGER:-}" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Não foi encontrado o sdkmanager no runner do GitHub."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Bonny-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Mostrar instruções de download
        if: success()
        run: |
          {
            echo '## APK do Bonny gerado com sucesso'
            echo
            echo 'Abra a seção **Artifacts** desta execução e baixe **Bonny-debug-apk**.'
            echo 'Extraia o ZIP baixado para encontrar o APK.'
            echo
            echo '> Este é um APK de debug para testes. Não é uma versão assinada para publicação na Play Store.'
          } >> "$GITHUB_STEP_SUMMARY"
